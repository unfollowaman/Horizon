  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google tag (gtag.js) dataLayer stub -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-0TBLST0MRT");

      // Defer third-party non-critical scripts until user interaction or delayed fallback
      window.addEventListener("load", function() {
        var loaded = false;
        var loadThirdParty = function() {
          if (loaded) return;
          loaded = true;

          // Remove interaction listeners
          var events = ["pointerdown", "touchstart", "scroll", "keydown", "mousemove"];
          events.forEach(function(ev) {
            window.removeEventListener(ev, loadThirdParty, { passive: true });
          });

          var loadScript = function(src, attrs) {
            var s = document.createElement("script");
            s.src = src;
            if (attrs) {
              for (var key in attrs) {
                s.setAttribute(key, attrs[key]);
              }
            }
            document.body.appendChild(s);
          };

          loadScript("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9895594998996093", { crossorigin: "anonymous" });
          loadScript("https://www.googletagmanager.com/gtag/js?id=G-0TBLST0MRT", { async: "true" });
        };

        var events = ["pointerdown", "touchstart", "scroll", "keydown", "mousemove"];
        events.forEach(function(ev) {
          window.addEventListener(ev, loadThirdParty, { passive: true, once: true });
        });

        // Fallback timer if user doesn't interact within 3.5s after load
        setTimeout(loadThirdParty, 3500);
      });
    </script>
  </body>
