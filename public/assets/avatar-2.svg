<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Circular clip path to ensure clean geometry constrained precisely to the avatar boundary -->
  <defs>
    <clipPath id="circle-clip-2">
      <circle cx="64" cy="64" r="56" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-2)">
    <!-- White circular base -->
    <circle cx="64" cy="64" r="56" fill="#FFFFFF" />

    <!-- Bright yellow cloud-like shape with 5 rounded lobes along its lower edge -->
    <g fill="#F3C13A">
      <!-- Upper fill mass -->
      <path d="M 0 0 H 128 V 44 C 110 64 90 76 64 76 C 38 76 18 64 0 44 Z" />
      <!-- Scalloped lower cloud lobes -->
      <circle cx="24" cy="40" r="18" />
      <circle cx="39" cy="61" r="17.5" />
      <circle cx="64" cy="72" r="17.5" />
      <circle cx="89" cy="61" r="17.5" />
      <circle cx="104" cy="40" r="18" />
    </g>

    <!-- Facial features: Inverted/upside-down playful scrunched face (> < eyes and top mouth curve) -->
    <g fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper curved mouth (frown/upside-down smile) -->
      <path d="M 57 32.5 Q 64 26.5 71 32.5" />
      <!-- Left ">" angled eye -->
      <path d="M 51 40 L 57 44 L 51 48" />
      <!-- Right "<" angled eye -->
      <path d="M 77 40 L 71 44 L 77 48" />
    </g>
  </g>
</svg>