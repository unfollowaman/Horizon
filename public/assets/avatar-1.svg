<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Circular clip path to ensure clean geometry constrained precisely to the avatar boundary -->
  <defs>
    <clipPath id="circle-clip-1">
      <circle cx="64" cy="64" r="56" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-1)">
    <!-- White circular base -->
    <circle cx="64" cy="64" r="56" fill="#FFFFFF" />

    <!-- Light cyan-blue organic shape emerging from the bottom-left -->
    <circle cx="32" cy="80" r="50" fill="#82DCFF" />

    <!-- Facial features: Two circular eyes and a curved smile -->
    <g fill="#0A0A0A">
      <circle cx="40.5" cy="70.5" r="3.2" />
      <circle cx="61.5" cy="70.5" r="3.2" />
    </g>
    <path 
      d="M 45.5 78.5 Q 51 83.5 56.5 78.5" 
      fill="none" 
      stroke="#0A0A0A" 
      stroke-width="4" 
      stroke-linecap="round" 
    />
  </g>
</svg>