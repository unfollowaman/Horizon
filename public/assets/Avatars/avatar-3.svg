<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Circular clip path to ensure clean geometry constrained precisely to the avatar boundary -->
  <defs>
    <clipPath id="circle-clip-3">
      <circle cx="64" cy="64" r="56" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-3)">
    <!-- White circular base -->
    <circle cx="64" cy="64" r="56" fill="#FFFFFF" />

    <!-- Vivid medium-blue starburst polygon covering the center and bottom-right -->
    <polygon 
      points="28,118 33,104 20,83 41,72 36,48 56,52 64,33 75,43 91,26 107,42 122,28 135,135 20,135" 
      fill="#1A82F7" 
    />

    <!-- Facial features: Two closed curved eyes and an open D-shaped smiling mouth -->
    <g fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round">
      <path d="M 59 68.5 Q 64 72.5 69 68.5" />
      <path d="M 77 68.5 Q 82 72.5 87 68.5" />
    </g>
    <!-- Open smiling mouth -->
    <path 
      d="M 65.5 79.5 H 79.5 C 81 79.5 81.5 80.5 81 82 C 79.5 85.5 76.5 87 72.5 87 C 68.5 87 65.5 85.5 64 82 C 63.5 80.5 64 79.5 65.5 79.5 Z" 
      fill="#0A0A0A" 
    />
  </g>
</svg>